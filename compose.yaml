services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetingrooms
      POSTGRES_USER: meetingrooms
      POSTGRES_PASSWORD: meetingrooms
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingrooms -d meetingrooms"]
      interval: 5s
      timeout: 3s
      retries: 10
